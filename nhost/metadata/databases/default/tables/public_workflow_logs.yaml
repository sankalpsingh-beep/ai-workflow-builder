table:
  name: workflow_logs
  schema: public
object_relationships:
  - name: workflow_run
    using:
      foreign_key_constraint_on: workflow_run_id
  - name: step_run
    using:
      foreign_key_constraint_on: step_run_id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - workflow_run_id
        - step_run_id
        - log_type
        - data
        - created_at
      filter:
        workflow_run:
          workflow:
            organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id
      allow_aggregations: true
insert_permissions:
  - role: user
    permission:
      check:
        workflow_run:
          workflow:
            organization:
              members:
                _and:
                  - user_id:
                      _eq: X-Hasura-User-Id
                  - role:
                      _in: [owner, editor]
      columns:
        - workflow_run_id
        - step_run_id
        - log_type
        - data
