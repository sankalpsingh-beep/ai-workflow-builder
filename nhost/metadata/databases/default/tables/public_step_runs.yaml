table:
  name: step_runs
  schema: public
object_relationships:
  - name: workflow_run
    using:
      foreign_key_constraint_on: workflow_run_id
  - name: step
    using:
      foreign_key_constraint_on: step_id
  - name: approved_by_user
    using:
      foreign_key_constraint_on: approved_by
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - workflow_run_id
        - step_id
        - status
        - input
        - output
        - error
        - attempt_count
        - max_attempts
        - approved_by
        - approved_at
        - started_at
        - completed_at
        - created_at
        - updated_at
      filter:
        workflow_run:
          workflow:
            organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id
      allow_aggregations: true
insert_permissions:
  - role: user
    permission:
      check:
        workflow_run:
          workflow:
            organization:
              members:
                _and:
                  - user_id:
                      _eq: X-Hasura-User-Id
                  - role:
                      _in: [owner, editor]
      columns:
        - workflow_run_id
        - step_id
        - status
        - input
update_permissions:
  - role: user
    permission:
      columns:
        - status
        - output
        - error
        - attempt_count
        - approved_by
        - approved_at
        - started_at
        - completed_at
      filter:
        workflow_run:
          workflow:
            organization:
              members:
                _and:
                  - user_id:
                      _eq: X-Hasura-User-Id
                  - role:
                      _in: [owner, editor]
      check: null
