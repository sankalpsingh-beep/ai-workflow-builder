table:
  name: org_usage_stats
  schema: public
  is_view: true
select_permissions:
  - role: user
    permission:
      columns:
        - org_id
        - org_name
        - quota_limit
        - quota_used
        - quota_reset_at
        - total_workflows
        - total_runs
        - runs_this_month
        - avg_run_duration_seconds
      filter:
        org_id:
          _in: X-Hasura-Allowed-Orgs
