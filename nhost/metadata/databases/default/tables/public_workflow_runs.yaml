table:
  name: workflow_runs
  schema: public
object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
  - name: trigger
    using:
      foreign_key_constraint_on: trigger_id
  - name: triggered_by_user
    using:
      foreign_key_constraint_on: triggered_by
array_relationships:
  - name: step_runs
    using:
      foreign_key_constraint_on:
        column: workflow_run_id
        table:
          name: step_runs
          schema: public
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - workflow_id
        - trigger_id
        - triggered_by
        - trigger_type
        - status
        - input
        - output
        - error
        - started_at
        - completed_at
        - created_at
        - updated_at
      filter:
        workflow:
          organization:
            members:
              user_id:
                _eq: X-Hasura-User-Id
      allow_aggregations: true
insert_permissions:
  - role: user
    permission:
      check:
        workflow:
          organization:
            members:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - role:
                    _in: [owner, editor]
      columns:
        - workflow_id
        - trigger_id
        - triggered_by
        - trigger_type
        - status
        - input
      set:
        triggered_by: X-Hasura-User-Id
update_permissions:
  - role: user
    permission:
      columns:
        - status
        - output
        - error
        - started_at
        - completed_at
      filter:
        workflow:
          organization:
            members:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - role:
                    _in: [owner, editor]
      check: null
