table:
  name: org_members
  schema: public
object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id
  - name: user
    using:
      foreign_key_constraint_on: user_id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - user_id
        - org_id
        - role
        - created_at
        - updated_at
      filter:
        org_id:
          _in: X-Hasura-Allowed-Orgs
      allow_aggregations: true
insert_permissions:
  - role: user
    permission:
      check:
        _or:
          # User can create first member (themselves as owner) for new org
          - _not:
              organization:
                members:
                  id:
                    _is_null: false
          # Owner can add members to their org
          - organization:
              members:
                _and:
                  - user_id:
                      _eq: X-Hasura-User-Id
                  - role:
                      _eq: owner
      columns:
        - user_id
        - org_id
        - role
update_permissions:
  - role: user
    permission:
      columns:
        - role
      filter:
        organization:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: owner
      check: null
delete_permissions:
  - role: user
    permission:
      filter:
        _or:
          # User can remove themselves
          - user_id:
              _eq: X-Hasura-User-Id
          # Owner can remove members
          - organization:
              members:
                _and:
                  - user_id:
                      _eq: X-Hasura-User-Id
                  - role:
                      _eq: owner
