- name: scheduled_workflow_trigger
  webhook: '{{NHOST_FUNCTIONS_URL}}/scheduled-trigger'
  schedule: '* * * * *'
  include_in_metadata: true
  payload: {}
  retry_conf:
    num_retries: 3
    retry_interval_seconds: 10
    timeout_seconds: 60
  comment: Checks for scheduled workflows and triggers them
